version: "3.9"

services:
  # ────────────── 后端 API ──────────────
  backend:
    build: .
    container_name: bidding-qa-backend
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=neo4j://neo4j:7687
      - POSTGRES_HOST=postgres
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

  # ────────────── 前端 ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: bidding-qa-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped

  # ────────────── Qdrant 向量库 ──────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bidding-qa-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ────────────── PostgreSQL ──────────────
  postgres:
    image: postgres:16-alpine
    container_name: bidding-qa-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ────────────── Neo4j 图数据库 ──────────────
  neo4j:
    image: neo4j:5-community
    container_name: bidding-qa-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  pg_data:
  neo4j_data:
