[project]
name = "bidding-qa-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "pydantic>=2.13",
    "openai>=2.48",
    "zai-sdk>=0.2.3",
    "sentence-transformers>=5.6.1",
    "torch>=2.13",
    "transformers>=5.14",
    "jieba>=0.42.1",
    "qdrant-client>=1.18",
    "neo4j>=6.2",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.2",
    "tavily-python>=0.7.27",
    "httpx>=0.28.1",
    "pandas>=3.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]
[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
[tool.pytest.ini_options]
testpaths = ["tests"]
